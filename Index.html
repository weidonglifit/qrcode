<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code 掃描打卡系統</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background-color: #f4f4f9;
    }
    h1 {
      color: #333;
    }
    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .message {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
      min-height: 30px;
    }
    .success { color: green; }
    .error { color: red; }
    .loading { color: #555; }
  </style>
</head>
<body>

  <h1>QR Code 掃描打卡</h1>
  <div id="reader"></div>
  
  <div id="statusMessage" class="message">請將 QR Code 對準鏡頭</div>

  <script>
    // 你的 GAS API URL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxDBlXRiLMABJvYKgkDDM4sDfosgcvh18tQyIzbKM915CD1KjkImgYOA5Lvs5rPvT65/exec";

    // 呼叫 GAS 的函式 (由你提供)
    function callGasApi(action, params = []) {
      return fetch(GAS_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8",
        },
        body: JSON.stringify({ action: action, params: params })
      })
      .then(response => response.json())
      .then(res => {
        if (res.status === "error") {
          throw new Error(res.message);
        }
        return res.data; // 這裡會拿到 GAS 回傳的 "打卡成功！號碼：..."
      });
    }

    // 狀態控制，避免連續掃描觸發多次 API
    let isProcessing = false;
    const statusDiv = document.getElementById('statusMessage');

    // 當成功掃描到 QR Code 時觸發
    function onScanSuccess(decodedText, decodedResult) {
      // 如果正在處理上一個請求，則忽略這次掃描
      if (isProcessing) return;
      isProcessing = true;

      // 更新畫面狀態
      statusDiv.className = "message loading";
      statusDiv.innerText = `讀取到：${decodedText}，正在打卡中...`;

      // 呼叫 API 進行打卡
      callGasApi('attendanceTake', [decodedText])
        .then(resultData => {
          statusDiv.className = "message success";
          statusDiv.innerText = `✅ ${resultData}`;
        })
        .catch(error => {
          statusDiv.className = "message error";
          statusDiv.innerText = `❌ 打卡失敗: ${error.message}`;
        })
        .finally(() => {
          // 設定 3 秒後恢復可掃描狀態
          setTimeout(() => {
            isProcessing = false;
            statusDiv.className = "message";
            statusDiv.innerText = "請將 QR Code 對準鏡頭以進行下一位打卡";
          }, 3000);
        });
    }

    // 當掃描失敗或未找到 QR code 時觸發 (通常略過不處理)
    function onScanFailure(error) {
      // 不需印出錯誤，因為每一幀沒掃到都會觸發此函式
    }

    // 初始化 HTML5 QR Code 掃描器
    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader",
      { fps: 10, qrbox: {width: 250, height: 250} },
      /* verbose= */ false
    );
    
    // 渲染掃描器
    html5QrcodeScanner.render(onScanSuccess, onScanFailure);

  </script>
</body>
</html>
